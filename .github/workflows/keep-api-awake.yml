name: Keep the API awake

# Render's free plan puts the API to sleep after 15 minutes without a request, and the next visitor
# then waits a minute or more for it to start. Asking for /api/health every 10 minutes prevents that.
#
# Only between 06:00 and midnight in Nairobi (03:00-20:59 UTC): a free Render workspace gets 750
# running hours a month across all its services, and staying up around the clock would leave none
# for anything else. Overnight the first visitor still waits.
#
# GitHub runs schedules late when it is busy, and switches them off after 60 days without a commit
# to the repository; re-enable it under Actions if that happens.
on:
  schedule:
    - cron: '*/10 3-20 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Long enough for a sleeping API to wake; a failure shows up as a red run under Actions.
      - run: curl --fail --silent --show-error --max-time 180 --retry 2 https://eventify-v2.onrender.com/api/health
