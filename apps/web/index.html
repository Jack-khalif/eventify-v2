<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/eventify-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Set the theme before first paint so nobody sees a flash: the visitor's own choice, then the device's setting, else dark. Mirrors initialTheme() in src/app/theme.ts.
      var t = null;
      try {
        t = localStorage.getItem('eventify-theme');
      } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t =
          window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'dark';
      }
      document.documentElement.dataset.theme = t;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
